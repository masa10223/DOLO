[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dolo"
version = "0.1.0.dev0"
description = "Drosophila tracking with YOLO Pose — pose estimation, multi-fly tracking, and behavioral analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "DOLO contributors" }]
keywords = ["drosophila", "pose-estimation", "tracking", "yolo", "behavior"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# NOTE: 下限のみの緩い指定。実機の `pip freeze` を受け取り次第、
# requirements-lock.txt で再現可能な組み合わせに固定する。
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "natsort>=8.4",
]

[project.optional-dependencies]
# 推論・学習に必要（重い。CI やユニットテストでは不要）
torch = [
    "torch>=2.0",
    "ultralytics>=8.2",
]
# ローカルPC・リモートGPUサーバー共通のブラウザGUI。
# 3.10 以降にはアップロード名のパストラバーサル修正が含まれる。
gui = [
    "nicegui>=3.10,<4",
]
# アノテーション生成・学習データ作成
data = [
    "imgaug>=0.4",
    "scikit-learn>=1.3",
    "tifffile>=2023.7",
]
# 解析・作図
analysis = [
    "seaborn>=0.12",
    "networkx>=3.1",
    "pykalman>=0.9.7",
    "scikit-learn>=1.3",
    "pytz>=2023.3",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
all = ["dolo[torch,gui,data,analysis,dev]"]

[project.urls]
Homepage = "https://github.com/masa10223/DOLO"
Documentation = "https://github.com/masa10223/DOLO/tree/main/docs"

[project.scripts]
dolo = "dolo.cli:main"
dolo-gui = "dolo.gui.__main__:main"

[tool.setuptools.packages.find]
include = ["dolo*"]

[tool.setuptools.package-data]
"dolo.gui" = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_torch: requires torch + ultralytics to be installed",
    "needs_weights: requires model weights and a sample video (see tests/data/README.md)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
